<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Recursion on Arrays and Strings</title>
  </head>
  <body>
    <header><p>Recursion on Arrays and Strings</p></header>
    <main>
      <div class="container">
        <label for="string-print1">Print All Elements of an Array</label>
        <input
          type="text"
          id="string-print1"
          class="array-element"
          placeholder="[1,2,3,4]"
        />
        <p class="array-element-output">0</p>
      </div>
      <div class="container">
        <label for="string-print2">Find the Sum of All Elements</label>
        <input
          type="text"
          id="string-print2"
          class="sum-of-element"
          placeholder="[1,2,3,4]"
        />
        <p class="sum-of-element-output">0</p>
      </div>
      <div class="container">
        <label for="string-print3">Check if an Array Is Sorted (Ascending)</label>
        <input
          type="text"
          id="string-print3"
          class="isSort-ascending"
          placeholder="[1,2,3,4]"
        />
        <p class="isSort-ascending-output">0</p>
      </div>
      <div class="container">
        <label for="string-print4">Reverse a String</label>
        <input
          type="text"
          id="string-print4"
          class="reverse-string"
          placeholder="Sunil"
        />
        <p class="reverse-string-output">0</p>
      </div>
      <div class="container">
        <label for="string-print5">Check if a String Is Palindrome</label>
        <input
          type="text"
          id="string-print5"
          class="isPalindrome-string"
          placeholder="madam"
        />
        <p class="isPalindrome-string-output">0</p>
      </div>
      <div class="container">
        <label for="string-print6">Find the Length of a String</label>
        <input
          type="text"
          id="string-print6"
          class="length-of-string"
          placeholder="javascript"
        />
        <p class="length-of-string-output">0</p>
      </div>
      <div class="container">
        <label for="string-print7">Count the Number of Vowels in a String</label>
        <input
          type="text"
          id="string-print7"
          class="count-vowels"
          placeholder="javascript"
        />
        <p class="count-vowels-output">0</p>
      </div>
      <div class="container">
        <label for="string-print8">First Occurrence of an Element</label>
        <input
          type="text"
          id="string-print8"
          class="first-occ"
          placeholder="[1,2,3,4,3]"
        />
        <input
          type="text"
          id="string-print8-2"
          class="first-occ-2"
          placeholder="3"
        />
        <p class="first-occ-output">0</p>
      </div>
      <div class="container">
        <label for="string-print9">Last Occurrence of an Element</label>
        <input
          type="text"
          id="string-print9"
          class="last-occ"
          placeholder="[1,2,3,4,1]"
        />
        <input
          type="text"
          id="string-print9-2"
          class="last-occ-2"
          placeholder="1"
        />
        <p class="last-occ-output">0</p>
      </div>
      <div class="container">
        <label for="string-print10">Count Character Appears in a String</label>
        <input
          type="text"
          id="string-print10"
          class="count-char-str"
          placeholder="javascript"
        />
        <input
          type="text"
          id="string-print10-2"
          class="count-char-str-2"
          placeholder="a"
        />
        <p class="count-char-str-output">0</p>
      </div>
      <div class="container">
        <label for="string-print11">Replace All Occurrences of a Character</label>
        <input
          type="text"
          id="string-print11"
          class="replace-all-occur"
          placeholder="javascript"
        />
        <input
          type="text"
          id="string-print11-2"
          class="replace-all-occur-2"
          placeholder="a"
        />
        <input
          type="text"
          id="string-print11-3"
          class="replace-all-occur-3"
          placeholder="x"
        />
        <p class="replace-all-occur-output">0</p>
      </div>
       <div class="container">
        <label for="string-print12">All Elements in an Array Are Even</label>
        <input
          type="text"
          id="string-print12"
          class="even-array"
          placeholder="[2,4,6,8]"
        />
        <p class="even-array-output">0</p>
      </div>
       <div class="container">
        <label for="string-print13">Maximum Element in an Array</label>
        <input
          type="text"
          id="string-print13"
          class="max-el-array"
          placeholder="[2,4,9,8]"
        />
        <p class="max-el-array-output">0</p>
      </div>
    </main>
  </body>
</html>
